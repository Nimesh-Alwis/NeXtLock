<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeXtLock - Dashboard</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Dynamic Animated Background Orbs -->
    <div class="bg-glow orb-1"></div>
    <div class="bg-glow orb-2"></div>

    <div class="window">
        <!-- macOS Window Title Bar -->
        <div class="title-bar">
            <div class="window-controls">
                <div class="control close" id="btnCloseWindow" title="Lock Vault"></div>
                <div class="control minimize" title="Minimize"></div>
                <div class="control maximize" title="Maximize"></div>
            </div>
            <div class="window-title">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                NeXtLock Dashboard
            </div>
            <div class="user-badge" id="lockVaultBtn" title="Click to Lock Vault">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                <span>Lock Vault</span>
            </div>
        </div>

        <div class="app-container">
            <!-- Sidebar -->
            <aside class="sidebar">
                <div class="brand">
                    <div class="brand-logo">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                    </div>
                    <span>NeXt<span>Lock</span></span>
                </div>
                
                <div class="nav-section-title">CATEGORIES</div>
                <div class="sidebar-nav" id="sidebarCategoryNav">
                    <div class="nav-item active" data-filter="all">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
                        <span>All Categories</span>
                        <span class="nav-badge" id="totalCategoryBadge">0</span>
                    </div>
                </div>

                <button id="openAddCategoryModalBtn" class="btn-add-category">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    <span>Add New Category</span>
                </button>
                
                <!-- Vault Stats Widget -->
                <div class="stats-card">
                    <div class="stats-title">VAULT HEALTH</div>
                    <div class="stats-value" id="vaultHealthScore">100%</div>
                    <div class="stats-label">AES-256 Protected</div>
                </div>

                <div class="sidebar-footer">
                    <button class="btn-lock-sidebar" id="lockVaultSidebarBtn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                        Lock Vault
                    </button>
                </div>
            </aside>

            <!-- Main Content Area -->
            <main class="main-content">
                <header class="top-bar">
                    <div class="search-wrapper">
                        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        <input type="text" id="searchCategoryInput" class="search-bar" placeholder="Search categories...">
                    </div>
                    <div class="top-actions">
                        <button class="btn-primary" id="quickAddCategoryBtn">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                            <span>+ New Category</span>
                        </button>
                    </div>
                </header>

                <div class="content-header">
                    <div>
                        <h1 class="page-title">Vault Categories</h1>
                        <p class="page-subtitle">Organize your passwords, banking, and secret credentials</p>
                    </div>
                </div>

                <!-- Grid of Category Cards -->
                <div id="categoryList" class="category-grid">
                    <!-- Dynamic categories rendered by app.js -->
                </div>
            </main>
        </div>
    </div>

    <!-- Modal for Adding New Category -->
    <div id="addCategoryModal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Create New Category</h3>
                <button class="modal-close" id="closeCategoryModalBtn">&times;</button>
            </div>
            <div class="modal-body">
                <label for="categoryInput">Category Name</label>
                <div class="input-wrapper">
                    <input type="text" id="categoryInput" placeholder="e.g. Social Media, Work, Financial">
                </div>
                <div class="icon-selector">
                    <label>Choose Icon:</label>
                    <div class="icon-options">
                        <button type="button" class="icon-opt active" data-icon="📁">📁</button>
                        <button type="button" class="icon-opt" data-icon="💼">💼</button>
                        <button type="button" class="icon-opt" data-icon="🌐">🌐</button>
                        <button type="button" class="icon-opt" data-icon="🏦">🏦</button>
                        <button type="button" class="icon-opt" data-icon="🔒">🔒</button>
                        <button type="button" class="icon-opt" data-icon="🔑">🔑</button>
                        <button type="button" class="icon-opt" data-icon="🎮">🎮</button>
                        <button type="button" class="icon-opt" data-icon="📱">📱</button>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" id="cancelCategoryModalBtn">Cancel</button>
                <button class="btn-primary" id="createBtn">Create Category</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="toast-container"></div>

    <script src="app.js"></script>

</body>
</html>
