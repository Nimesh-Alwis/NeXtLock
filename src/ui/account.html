<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Account Details - NextLock</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <a href="index.html" class="back-link">← Back to Categories</a>
        
        <h1>Account Details</h1>
        
        <div class="form-group">
            <label>Username</label>
            <input type="text" id="username" value="example@gmail.com" readonly>
        </div>

        <div class="form-group">
            <label>Password</label>
            <div class="password-wrapper">
                <input type="password" id="password" value="secret123">
                <button type="button" id="toggle-password">👁️</button>
            </div>
        </div>

        <div class="meta-info">
            <p>Last Updated: <span id="update-time">2026-06-07 15:30</span></p>
        </div>

        <div id="status-msg" style="display:none; color: #4caf50; margin: 10px 0;"></div>

        <button id="update-btn">Update Password</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
